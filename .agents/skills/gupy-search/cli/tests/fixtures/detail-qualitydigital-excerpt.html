<script type="application/ld+json">{&quot;@context&quot;:&quot;http://schema.org&quot;,&quot;@type&quot;:&quot;JobPosting&quot;,&quot;datePosted&quot;:&quot;2026-11-18&quot;,&quot;description&quot;:&quot;&lt;h2&gt;Descrição da vaga&lt;/h2&gt;&lt;p&gt;&lt;p&gt;Nós somos a&lt;strong&gt; Quality Digital&lt;/strong&gt;! Saiba mais sobre a gente:&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Uma frase que nos define &lt;/strong&gt;- Somos especialistas em soluções de TI e apaixonados por inovação! 🚀&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Ao infinito e além&lt;/strong&gt; - Somos &lt;em&gt;#semfronteiras&lt;/em&gt;. Nosso time está espalhado pelo Brasil e pelo mundo 🌎&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Nossa cultura&lt;/strong&gt; - Mesmo distantes, estamos juntos 🧡 Temos cerimônias para estarmos mais próximos, compartilhar conhecimento e ficar por dentro das novidades da nossa empresa!&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Somos diversos&lt;/strong&gt; - Um dos nossos compromissos é fazer da companhia um ambiente cada vez mais diverso, inclusivo e respeitoso, valorizando e promovendo a pluralidade. Por isso, &lt;strong&gt;aqui temos espaço para todas as pessoas,&lt;/strong&gt; independente de raça, gênero, idade, orientação sexual, crença religiosa ou deficiência. &lt;span style=\&quot;color: rgb(51, 51, 51);\&quot;&gt;🏳️‍🌈&lt;/span&gt;👩🏾‍🦽&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Nosso objetivo&lt;/strong&gt; - Potencializar os negócios dos nossos clientes através de soluções inovadoras e sustentáveis. Topa vir com a gente nessa? 🎯&lt;/li&gt;&lt;/ul&gt;&lt;/p&gt;&lt;br&gt;&lt;br&gt;&lt;h2&gt;Responsabilidades e atribuições&lt;/h2&gt;&lt;p&gt;&lt;p&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;O que buscamos? &lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\&quot;letter-spacing: 0.3px; font-family: -apple-system, BlinkMacSystemFont, &amp;quot;Segoe UI&amp;quot;, Roboto, sans-serif;\&quot;&gt;Você vai liderar a modernização de um sistema legado em Visual FoxPro, reconstruindo-o em .NET com o apoio de IA, dentro da metodologia Traction da Quality Digital. No dia a dia, você usa ferramentas de IA para ler o código Fox e as bases DBF, extrair as regras de negócio e transformá-las em especificações (casos de uso e cenários BDD). Depois, valida essas regras com o desenvolvedor do time Fox do cliente, implementa as funcionalidades em .NET e entrega cada uma com testes automatizados. Você trabalha em um time híbrido, junto com o PO da Quality e um desenvolvedor sênior do cliente, que conhece profundamente o sistema legado e que você também vai capacitar na metodologia e no novo código. As demandas e entregas são acompanhadas no Azure DevOps.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Responsabilidades&amp;nbsp;&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Operar a esteira Traction e as ferramentas de IA (Cursor) na engenharia reversa do código Visual FoxPro: programas, telas, classes, relatórios e bases DBF.&lt;/li&gt;&lt;li&gt;Mapear regras de negócio distribuídas em telas, relatórios, triggers e procedures do legado, incluindo exceções e comportamentos não documentados.&lt;/li&gt;&lt;li&gt;Gerar e manter a especificação de cada funcionalidade (caso de uso e cenários Given/When/Then) e conduzir a validação com o desenvolvedor do cliente.&lt;/li&gt;&lt;li&gt;Implementar o novo sistema em .NET, revisando criticamente todo código gerado por IA antes de abrir o PR.&amp;nbsp;&lt;/li&gt;&lt;li&gt;Elaborar o plano de testes e desenvolver testes automatizados, incluindo testes de paridade entre o sistema legado e o novo.&amp;nbsp;&lt;/li&gt;&lt;li&gt;Modelar a nova base de dados e apoiar a migração dos dados do legado.&amp;nbsp;&lt;/li&gt;&lt;li&gt;Considerar na arquitetura as integrações com o sistema de precificação e a modernização do Gestcom.&lt;/li&gt;&lt;li&gt;Capacitar o desenvolvedor do cliente na metodologia e no código .NET do novo sistema.&amp;nbsp;&lt;/li&gt;&lt;li&gt;Manter a rastreabilidade no Azure DevOps: card, especificação, código e teste.&lt;/li&gt;&lt;/ul&gt;&lt;/p&gt;&lt;br&gt;&lt;br&gt;&lt;h2&gt;Requisitos e qualificações&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;Obrigatórios&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;Experiência sólida com C# e .NET (&lt;a target=\&quot;_blank\&quot; rel=\&quot;noreferrer noopener\&quot; key=\&quot;link1\&quot; href=http://ASP.NET&gt;ASP.NET&lt;/a&gt; Core, Web API, Entity Framework Core).&amp;nbsp;&lt;/li&gt;&lt;li&gt;SQL Server: modelagem de dados, migrações e otimização de consultas.&amp;nbsp;&lt;/li&gt;&lt;li&gt;Capacidade de ler e entender código legado procedural e orientado a dados.&amp;nbsp;&lt;/li&gt;&lt;li&gt;Uso prático de ferramentas de IA no desenvolvimento (Cursor, GitHub Copilot, Claude Code ou similares), com senso crítico para revisar e corrigir o que a IA produz.&amp;nbsp;&lt;/li&gt;&lt;li&gt;Testes automatizados: xUnit ou NUnit, testes de integração e BDD (Reqnroll, SpecFlow ou similar).&amp;nbsp;&lt;/li&gt;&lt;li&gt;Git e Azure DevOps (boards, repos e pipelines).&amp;nbsp;&lt;/li&gt;&lt;li&gt;Autonomia para conduzir o desenvolvimento como principal desenvolvedor do projeto.&amp;nbsp;&lt;/li&gt;&lt;li&gt;Boa comunicação com PO, cliente e time técnico, inclusive para apoiar a capacitação de outros desenvolvedores&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;Desejável&lt;/strong&gt;&amp;nbsp;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Experiência com Visual FoxPro ou outras linguagens legadas (Clipper, Delphi, VB6).&amp;nbsp;&lt;/li&gt;&lt;li&gt;Participação anterior em projetos de migração ou modernização de sistemas legados, especialmente com dados em DBF.&amp;nbsp;&lt;/li&gt;&lt;li&gt;Conhecimento do domínio de varejo ou supermercado: estoque, pedidos de compra e cadastros fiscais (CFOP, NCM, tributação).&amp;nbsp;&lt;/li&gt;&lt;li&gt;Experiência com front-end web em Blazor ou React.&amp;nbsp;&lt;/li&gt;&lt;li&gt;Experiência na escrita de especificações funcionais e casos de uso.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;span style=\&quot;letter-spacing: normal;\&quot;&gt;&lt;strong&gt;Modelo de Atuação&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\&quot;letter-spacing: normal;\&quot;&gt;Remoto&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span style=\&quot;letter-spacing: normal;\&quot;&gt;Das 08h às 17h&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0); background-color: transparent;\&quot;&gt;OBS.: &lt;/strong&gt;&lt;span style=\&quot;color: rgb(0, 0, 0); background-color: transparent;\&quot;&gt;Hey! Caso você não preencha todos os requisitos da vaga, te convidamos a se candidatar mesmo assim, ok? Faremos uma análise cuidadosa do seu perfil considerando todas as suas qualificações 😉&lt;/span&gt;&lt;/p&gt;&lt;/p&gt;&lt;br&gt;&lt;br&gt;&lt;h2&gt;Informações adicionais&lt;/h2&gt;&lt;p&gt;&lt;p&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0); background-color: transparent;\&quot;&gt;O que você vai encontrar aqui:&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;Um ambiente propício para &lt;/span&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;aprendizado &lt;/strong&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;e &lt;/span&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;crescimento profissional 🎯&lt;/strong&gt;&lt;/li&gt;&lt;li&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;Avaliação de desempenho &lt;/strong&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;e &lt;/span&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;feedbacks&lt;/strong&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;, visando o desenvolvimento contínuo das nossas pessoas&lt;/span&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt; 📊&lt;/strong&gt;&lt;/li&gt;&lt;li&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;Vale alimentação e/ou refeição &lt;/strong&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;para suas compras de mercado e refeições 🍴&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;Assistência médica e odontológica&lt;/strong&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt; para que você e sua família estejam com a saúde em dia&lt;/span&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt; 💙&lt;/strong&gt;&lt;/li&gt;&lt;li&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;Convênio com farmácias &lt;/strong&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;para descontos em medicamentos&lt;/span&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt; 💊&lt;/strong&gt;&lt;/li&gt;&lt;li&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;Auxílio creche&lt;/strong&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt; de acordo com política vigente&lt;/span&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt; 🍼&lt;/strong&gt;&lt;/li&gt;&lt;li&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;Parceria com o SESC &lt;/strong&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;para programações variadas de cultura e lazer&lt;/span&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt; ✈&lt;/strong&gt;&lt;/li&gt;&lt;li&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;Parcerias para&amp;nbsp;seus estudos &lt;/strong&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;de idiomas, tecnologia e plataforma de cursos&lt;/span&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt; 📚&lt;/strong&gt;&lt;/li&gt;&lt;li&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;Empréstimo consignado&lt;/strong&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt; com taxas atrativas + programa de educação financeira &lt;/span&gt;&lt;span style=\&quot;color: rgb(32, 33, 36);\&quot;&gt;💰&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;Universidade Corporativa e trilhas de conhecimento&lt;/strong&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt; com conteúdos diversos de tecnologia, soft skills, tendências de mercado e muito mais 👨‍💻&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;Programa de Indicações&lt;/strong&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt; com possibilidade de prêmios e bonificações 🎁&amp;nbsp;&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;strong style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;Seguro de vida &lt;/strong&gt;&lt;span style=\&quot;color: rgb(0, 0, 0);\&quot;&gt;coletivo&amp;nbsp;⛑&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/p&gt;&lt;br&gt;&lt;br&gt;&quot;,&quot;employmentType&quot;:&quot;FULL_TIME&quot;,&quot;hiringOrganization&quot;:{&quot;@type&quot;:&quot;Organization&quot;,&quot;name&quot;:&quot;Quality Digital&quot;,&quot;sameAs&quot;:&quot;&quot;,&quot;logo&quot;:&quot;https://attachments.gupy.io/production/companies/36502/career/158542/images/2023-05-16_16-51_companyLogoUrl.png&quot;},&quot;jobLocation&quot;:{&quot;@type&quot;:&quot;Place&quot;,&quot;address&quot;:{&quot;@type&quot;:&quot;PostalAddress&quot;,&quot;streetAddress&quot;:&quot;Brasil&quot;,&quot;addressCountry&quot;:&quot;Brasil&quot;},&quot;additionalProperty&quot;:{&quot;@type&quot;:&quot;PropertyValue&quot;,&quot;value&quot;:&quot;TELECOMMUTE&quot;}},&quot;title&quot;:&quot;PESSOA DESENVOLVEDORA SÊNIOR (BACK-END)&quot;,&quot;validThrough&quot;:&quot;2026-11-26&quot;}</script>
